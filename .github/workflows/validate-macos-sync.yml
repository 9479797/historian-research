name: Проверка скриптов синхронизации macOS

on:
  push:
    paths:
      - 'scripts/*.sh'
      - '.github/workflows/validate-macos-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check for local update and installer
        run: |
          bash -n scripts/sync-macos.sh
          bash -n scripts/install-macos-sync.sh
